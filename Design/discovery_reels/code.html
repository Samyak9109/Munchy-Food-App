<!-- Lightweight interaction script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Heart icon toggle logic for visual feedback
                const icon = this.querySelector('.material-symbols-outlined');
                if (icon && icon.textContent.trim() === 'favorite') {
                    const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
                    icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
                    icon.classList.toggle('text-primary');
                }
            });
        });
    </script>
